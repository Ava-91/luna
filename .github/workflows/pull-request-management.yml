name: Pull request management

on:
  # A commit explicitly marked [backfill-prs] triggers a full historical backfill.
  # Ordinary workflow edits do not reprocess existing PRs.
  push:
    branches: [main]
    paths:
      - '.github/workflows/pull-request-management.yml'
  # Future PRs: process only newly opened PRs.
  pull_request_target:
    types: [opened]
  # Manual runs always perform a full backfill.
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pull-request-management-${{ github.event.pull_request.number || 'backfill' }}
  cancel-in-progress: false

jobs:
  label-and-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Label and assign pull requests
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'pull-request';
            const assignee = 'Ava-91';

            // Only an explicitly marked push performs a historical backfill.
            // This prevents ordinary workflow edits from repeatedly processing all PRs.
            if (context.eventName === 'push') {
              const message = context.payload.head_commit?.message || '';
              if (!message.includes('[backfill-prs]')) {
                core.info('No [backfill-prs] marker in commit message; skipping historical backfill.');
                return;
              }
            }

            // Ensure the shared label exists before processing any PRs.
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({
                  owner, repo, name: label,
                  color: '1D76DB',
                  description: 'Automatically applied to every pull request'
                });
              } catch (createError) {
                if (createError.status !== 422) throw createError;
              }
            }

            // Manual dispatch and marked installation pushes: every PR, any state.
            // Normal future event: only the newly opened PR.
            let pullRequests;
            if (context.eventName === 'workflow_dispatch' || context.eventName === 'push') {
              pullRequests = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'all', per_page: 100
              });
              core.info(`Historical backfill: ${pullRequests.length} PRs.`);
            } else {
              pullRequests = [{ number: context.payload.pull_request.number }];
            }

            for (const pr of pullRequests) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: [label]
              });
              await github.rest.issues.addAssignees({
                owner, repo, issue_number: pr.number, assignees: [assignee]
              });
              core.info(`Labeled and assigned PR #${pr.number}.`);
            }
