[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-music-manager"
version = "0.2.0"
description = "A local-first music library cleaner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mutagen>=1.47,<2"]

[project.optional-dependencies]
desktop = ["PySide6>=6.7,<7"]
artwork = ["Pillow>=10,<12"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
luna = "luna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
